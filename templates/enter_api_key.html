<!DOCTYPE html>
<html>
<head>
    <title>Enter API Key for Asset {{ asset_id }}</title>
</head>
<body>
    <h2>Enter API Key for Asset {{ asset_id }}</h2>
    <form id="api-key-form">
        <input type="hidden" id="asset_id" value="{{ asset_id }}">
        <label>API Key: <input type="text" id="api_key" required></label>
        <button type="submit">Submit</button>
    </form>
    <div id="result"></div>
    <script>
        document.getElementById('api-key-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const assetId = document.getElementById('asset_id').value;
            const apiKey = document.getElementById('api_key').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = "Loading...";

            fetch(`/api/assets/${assetId}/`, {
                method: 'GET',
                headers: {
                    'Api-Key': apiKey
                }
            })
            .then(response => {
                if (!response.ok) {
                    if (response.status === 403 || response.status === 401) {
                        throw new Error("Invalid or unauthorized API Key.");
                    } else if (response.status === 404) {
                        throw new Error("Asset not found.");
                    } else {
                        throw new Error("Unknown error occurred.");
                    }
                }
                return response.json();
            })
            .then(data => {
                resultDiv.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            })
            .catch(error => {
                resultDiv.innerHTML = `<span style="color:red">${error.message}</span>`;
            });
        });
    </script>
</body>
</html>

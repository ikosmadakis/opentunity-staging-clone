{% load static %}
<!DOCTYPE html>
<html>
<head>
    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
    <title>OPENTUNITY UI</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    .opentunity-gradient-thead {
        background: linear-gradient(90deg, #407EC0 0%, #8CB727 50%, #407EC0 100%);
        color: #fff !important;
    }
    .opentunity-gradient-thead th {
        background: transparent !important;
        color: #fff !important;
        height: 48px;
        vertical-align: middle;
        text-align: center;
        font-weight: bold;
        border: none;
    }
  </style>
</head>
<body>

  <div class="container">
    {# Messages Framework Display #}
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="alert alert-{{ message.tags }}">
            {{ message }}
          </li>
        {% endfor %}
      </ul>
    {% endif %}

    {# Main content block #}
    {% block content %}
    {% endblock %}
  </div>

  <!-- Optional: Auto‐dismiss script for messages -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.messages .alert').forEach(el => {
        setTimeout(() => {
          el.classList.add('fade');
          setTimeout(() => el.remove(), 500);
        }, 3000);
      });
    });
  </script>
  <style>
    .fade { opacity: 0; transition: opacity 0.5s; }
  </style>
</body>
<footer class="text-center py-3" style="font-size: 0.9em; color: #888;">
  Powered by <a href="https://bluesun.pro" target="_blank" style="color: #407EC0;">Blue Sun Automation Ltd</a>
</footer>
</html>

{% extends "base.html" %}

{% block content %}
  <h2>Edit Device: {{ asset.model_name }}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Changes</button>
  </form>
  <p>
    <a href="{% url 'asset_detail' asset.id %}">Cancel</a>
  </p>
{% endblock %}

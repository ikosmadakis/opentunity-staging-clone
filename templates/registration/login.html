{% extends "base.html" %}
{% block content %}
  <h2>Log in</h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>

  <p class="mt-3">
    Don’t have an account?
    <a href="{% url 'signup' %}">Sign up here</a>
  </p>
  <p class="mt-3">
      Forgot your password?
      <a href="{% url 'password_reset' %}">Reset password</a>
  </p>

{% endblock %}

{% extends "base.html" %}
{% block content %}
  <h2>Add a New Device</h2>
  <form method="post" action="{% url 'add_device' %}">
    {% csrf_token %}

    {{ asset_form.as_p }}

    <div id="elec-specs" class="spec-block">
      <h3>Electrical Specs (non-BESS)</h3>
      {{ elec_form.non_field_errors }}
      {{ elec_form.as_p }}
    </div>

    <div id="bess-specs" class="spec-block">
      <h3>BESS Specs (for Battery)</h3>
      {{ bess_form.non_field_errors }}
      {{ bess_form.as_p }}
    </div>

    <button type="submit" class="btn btn-primary">Submit</button>
    <a href="{% url 'dashboard' %}" class="btn btn-secondary ms-2">Cancel</a>
  </form>

  <script>
    const cls     = document.getElementById("id_classification");
    const elecDiv = document.getElementById("elec-specs");
    const bessDiv = document.getElementById("bess-specs");

    function toggleSpecs() {
      const isBattery = cls.options[cls.selectedIndex].text.toUpperCase() === 'BATTERY';

      elecDiv.style.display = isBattery ? 'none' : 'block';
      bessDiv.style.display = isBattery ? 'block': 'none';

      elecDiv.querySelectorAll('input, select, textarea').forEach(el => {
        el.disabled = isBattery;
      });
      bessDiv.querySelectorAll('input, select, textarea').forEach(el => {
        el.disabled = !isBattery;
      });
    }

    cls.addEventListener('change', toggleSpecs);
    window.addEventListener('load', toggleSpecs);
  </script>
{% endblock %}
